<svg xmlns="http://www.w3.org/2000/svg" width="590" height="895" viewBox="0 0 1180 1790" font-family="Helvetica, Arial, sans-serif">
<rect width="1180" height="1790" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<text x="40" y="50" font-size="30" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">How the forked circuit-bank workflow works</text>
<text x="40" y="78" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Chen's problem-creation loop, run unchanged; two agents replaced by scripts; the numerical stage done by circuit-diagram-skill</text>
<rect x="40" y="98" width="18" height="14" fill="#DCE6EE" stroke="#C9C2B8"/>
<text x="66" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Zhongzhou Chen — unchanged, run in place</text>
<rect x="340" y="98" width="18" height="14" fill="#F7E3D4" stroke="#C9C2B8"/>
<text x="366" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">circuit-bank glue — new, deterministic</text>
<rect x="640" y="98" width="18" height="14" fill="#E2EEDC" stroke="#C9C2B8"/>
<text x="666" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">circuit-diagram-skill — deterministic engine</text>
<rect x="960" y="98" width="18" height="14" fill="#F3EFEA" stroke="#C9C2B8"/>
<text x="986" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">file on disk</text>
<rect x="230" y="150" width="560" height="145" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="248" y="182" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">1  Input scheme</text>
<text x="248" y="210" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Chen's input YAML (name, context, specs, n_scenarios, formulas)</text>
<text x="248" y="230" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+ bank: id, question type, drawing layout</text>
<text x="248" y="250" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+ ranges: resistors, voltage, min/max resistors, reduction steps</text>
<text x="248" y="270" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+ generator: enumerate | llm, seed</text>
<text x="776" y="283" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">format: Chen</text>
<rect x="830" y="185" width="310" height="56" rx="6" fill="#F3EFEA" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="985.0" y="209" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">circuit-input.yaml</text>
<text x="985.0" y="228" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the recipe — the item count lives here, never in chat</text>
<path d="M790,213 L830,213" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<path d="M510.0,295 L510.0,335" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="230" y="335" width="560" height="105" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="248" y="367" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2  Agent 1 check + confirmation</text>
<text x="248" y="395" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">validate_input.py — required fields, warning if n &gt; 10</text>
<text x="248" y="415" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the edited input is shown; nothing runs until the user confirms</text>
<text x="776" y="428" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Chen</text>
<path d="M510.0,440 L510.0,480" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="230" y="480" width="560" height="125" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="248" y="512" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3  Sidecar + loop control</text>
<text x="248" y="540" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">scenario_list.py  init → target copied from n_scenarios</text>
<text x="248" y="560" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">receive → update_count + 1, needed = target − accepted</text>
<text x="248" y="580" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">5-pass cap; accepted / pending / rejected (with reasons)</text>
<text x="776" y="593" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Chen</text>
<rect x="830" y="515" width="310" height="56" rx="6" fill="#F3EFEA" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="985.0" y="539" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">circuit-input.scenarios.yaml</text>
<text x="985.0" y="558" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the source of truth — the bank regenerates from it</text>
<path d="M790,543 L830,543" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<path d="M510.0,605 L510.0,645" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="522.0" y="630.0" font-size="12" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">needed &gt; 0</text>
<rect x="230" y="645" width="560" height="160" rx="12" fill="#F7E3D4" stroke="#D8D2CA"/>
<text x="248" y="677" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">4  Propose candidates</text>
<text x="248" y="705" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">enumerate_lingo.py (default, no AI): every series-parallel shape in the</text>
<text x="248" y="725" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">difficulty band, skipping accepted shapes; values from a pool by seed</text>
<text x="248" y="745" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">so every intermediate resistance is clean and no answer repeats</text>
<text x="248" y="765" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">— or Agent 2 (LLM) writes lingo, opt-in (generator: llm)</text>
<text x="776" y="793" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">replaces Chen's Agent 2</text>
<rect x="830" y="685" width="310" height="56" rx="6" fill="#F3EFEA" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="985.0" y="709" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">agent2.json</text>
<text x="985.0" y="728" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the candidates — same JSON either way</text>
<path d="M790,713 L830,713" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<path d="M510.0,805 L510.0,845" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="522.0" y="830.0" font-size="12" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">add_lingo.py → pending</text>
<rect x="230" y="845" width="560" height="175" rx="12" fill="#F7E3D4" stroke="#D8D2CA"/>
<text x="248" y="877" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">5  Critic — a script, not an opinion</text>
<text x="248" y="905" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">critic.py, for each pending lingo:</text>
<text x="248" y="925" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">parse + solve with the circuit engine          → else reject</text>
<text x="248" y="945" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">canonical shape not already accepted           → else reject (same path)</text>
<text x="248" y="965" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">reduction steps = this bank's difficulty       → else reject</text>
<text x="248" y="985" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">resistor / voltage / count within the ranges   → else reject</text>
<text x="776" y="1008" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">replaces Chen's Agent 3</text>
<path d="M790,920 L830,920" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<text x="810.0" y="913" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">remove: keep / reject + reason</text>
<path d="M510.0,1020 L510.0,1060" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="522.0" y="1045.0" font-size="12" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">complete</text>
<path d="M230,990 L100,990 L100,585 L230,585" stroke="#777" stroke-width="2" fill="none" stroke-dasharray="7,5" marker-end="url(#a)"/>
<text x="90" y="777.5" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">not complete:</text>
<text x="90" y="797.5" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">receive again</text>
<text x="90" y="817.5" font-size="12" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(Chen's loop)</text>
<rect x="230" y="1060" width="560" height="150" rx="12" fill="#E2EEDC" stroke="#D8D2CA"/>
<text x="248" y="1092" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">6  Circuit engine</text>
<text x="248" y="1120" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">circuit-diagram-skill, once per accepted lingo:</text>
<text x="248" y="1140" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">parse → solve (reduction steps, per-part current / voltage / power)</text>
<text x="248" y="1160" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">→ Schemdraw figure (one layout for the whole bank) → worked solution</text>
<text x="248" y="1180" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">same text in → same figure, numbers and solution out</text>
<text x="776" y="1198" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">replaces Chen's Agents 4 + 5</text>
<rect x="830" y="1095" width="310" height="56" rx="6" fill="#F3EFEA" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="985.0" y="1119" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">figures/qN.png</text>
<text x="985.0" y="1138" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">one figure per item</text>
<path d="M790,1123 L830,1123" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<path d="M510.0,1210 L510.0,1250" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="230" y="1250" width="560" height="150" rx="12" fill="#F7E3D4" stroke="#D8D2CA"/>
<text x="248" y="1282" font-size="20" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">7  Assemble the bank</text>
<text x="248" y="1310" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">distractors.py — three wrong answers, each one named mistake</text>
<text x="248" y="1330" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(all_series, no_invert, branch_current; fallbacks on collision)</text>
<text x="248" y="1350" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">assemble_bank.py → bank YAML in Chen's template, status ready</text>
<text x="248" y="1370" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">bank_to_pdf.py → printable worksheet + answer key</text>
<text x="776" y="1388" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">new</text>
<rect x="830" y="1255" width="310" height="56" rx="6" fill="#F3EFEA" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="985.0" y="1279" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">&lt;id&gt;.yaml</text>
<text x="985.0" y="1298" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the bank — Chen's template; importable</text>
<path d="M790,1283 L830,1283" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<rect x="830" y="1318" width="310" height="56" rx="6" fill="#F3EFEA" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="985.0" y="1342" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">&lt;id&gt;.pdf</text>
<text x="985.0" y="1361" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">worksheet + key — for humans, never students</text>
<path d="M790,1346 L830,1346" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<rect x="40" y="1450" width="540.0" height="290" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="58" y="1482" font-size="18" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">What is Chen's — used unchanged</text>
<text x="58" y="1512" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the definition of isomorphic (same objective, variation beyond</text>
<text x="58" y="1534" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   numbers, a changed solution, consistent difficulty)</text>
<text x="58" y="1556" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the input scheme and its required fields</text>
<text x="58" y="1578" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Agent 1 check and the confirmation gate</text>
<text x="58" y="1600" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">scenario_list.py: sidecar, target, pass cap, accept / reject + reasons</text>
<text x="58" y="1622" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the bank YAML template and the folder convention</text>
<text x="58" y="1644" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif"></text>
<text x="58" y="1666" font-size="13.5" fill="#1E1E1E" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Nothing in his repository was edited: the skill is a sibling folder</text>
<text x="58" y="1688" font-size="13.5" fill="#1E1E1E" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(.cursor/skills/circuit-bank/) and calls his script in place.</text>
<rect x="600.0" y="1450" width="540.0" height="290" rx="12" fill="#F7E3D4" stroke="#D8D2CA"/>
<text x="618.0" y="1482" font-size="18" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">What changed — and why</text>
<text x="618.0" y="1512" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Agent 2 → enumerator: circuits are a finite set (34 shapes at</text>
<text x="618.0" y="1534" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   3 steps); list them instead of guessing</text>
<text x="618.0" y="1556" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Agent 3 → script: a circuit can be parsed, solved and canonicalised,</text>
<text x="618.0" y="1578" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   so 'is this a new problem?' is computed, not judged</text>
<text x="618.0" y="1600" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Agents 4 + 5 → circuit engine: his sympy stage expresses formulas,</text>
<text x="618.0" y="1622" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   not topologies; the engine also draws the figure</text>
<text x="618.0" y="1644" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">added: a difficulty band (reduction steps), computed distractors,</text>
<text x="618.0" y="1666" font-size="13.5" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   figures, PDF, and a 'no two answers repeat' rule</text>
<text x="618.0" y="1688" font-size="13.5" fill="#1E1E1E" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">result: 30 items, one difficulty, 0 rejections, no LLM; same seed → same bank</text>
</svg>