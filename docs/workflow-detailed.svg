<svg xmlns="http://www.w3.org/2000/svg" width="615" height="793" viewBox="0 0 1230 1586" font-family="Helvetica, Arial, sans-serif">
<rect width="1230" height="1586" fill="#FFFFFF"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777"/></marker></defs>
<text x="40" y="50" font-size="30" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Circuit problem-bank workflow — detailed</text>
<text x="40" y="78" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Generate → check → count loop from the isomorphic-bank-creation framework; every numerical stage is rule-based code.</text>
<rect x="40" y="98" width="18" height="14" fill="#DCE6EE" stroke="#C9C2B8"/>
<text x="66" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">rule-based code (same input, same output, every time)</text>
<rect x="477.6" y="98" width="18" height="14" fill="#F3D9D3" stroke="#C9C2B8"/>
<text x="503.6" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">AI language model</text>
<rect x="656.0" y="98" width="18" height="14" fill="#E2EEDC" stroke="#C9C2B8"/>
<text x="682.0" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">file or output</text>
<rect x="812.8" y="98" width="18" height="14" fill="#F3EFEA" stroke="#C9C2B8"/>
<text x="838.8" y="110" font-size="13" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">goal / context</text>
<rect x="240" y="150" width="640" height="102" rx="12" fill="#F3EFEA" stroke="#D8D2CA"/>
<text x="258" y="180" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">Goal</text>
<text x="258" y="208" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">An isomorphic bank: same objective, variation beyond numbers (the circuit topology changes),</text>
<text x="258" y="228" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">each variant has its own solution path, and difficulty is held constant and defined up front.</text>
<path d="M560.0,252 L560.0,292" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="292" width="640" height="142" rx="12" fill="#F3EFEA" stroke="#D8D2CA"/>
<text x="258" y="322" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">1  Input scheme</text>
<text x="258" y="350" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Bank metadata (id, title, learning objective, question type = multiple choice).</text>
<text x="258" y="370" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Counts: n_scenarios 30.   Ranges: resistors 1–12 Ω, voltage 6–24 V.</text>
<text x="258" y="390" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Difficulty: reduction_steps 3, min_resistors 5, max_resistors 6.</text>
<text x="258" y="410" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Generator: auto (rules first, AI only as a tagged fallback), seed 0.</text>
<text x="866" y="424" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">validated by schema check</text>
<rect x="920" y="312" width="280" height="56" rx="6" fill="#E2EEDC" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="1060.0" y="336" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">circuit-input.yaml</text>
<text x="1060.0" y="355" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">the recipe; the item count lives here, never in chat</text>
<path d="M880,340 L920,340" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<rect x="920" y="374" width="280" height="92" rx="12" fill="#F3D9D3" stroke="#D8D2CA"/>
<text x="938" y="404" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">AI, step 1</text>
<text x="938" y="432" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Turns a plain-English request into</text>
<text x="938" y="452" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">this file; fixes typos. Nothing numerical.</text>
<path d="M560.0,434 L560.0,474" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="474" width="640" height="102" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="258" y="504" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">2  Scenario list</text>
<text x="258" y="532" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">A sidecar file tracks the target (30), accepted / pending / rejected scenarios,</text>
<text x="258" y="552" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">reasons for rejection and the pass count (cap: 5 passes).</text>
<text x="866" y="566" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">scenario_list.py</text>
<rect x="920" y="488" width="280" height="56" rx="6" fill="#E2EEDC" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="1060.0" y="512" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">circuit-input.scenarios.yaml</text>
<text x="1060.0" y="531" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">source of truth for what is in the bank</text>
<path d="M880,516 L920,516" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<path d="M560.0,576 L560.0,616" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="616" width="640" height="162" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="258" y="646" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">3  Generate  (Agent 2)</text>
<text x="258" y="674" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Enumerator lists all series-parallel shapes in the band: 5 resistors → 10 shapes, 6 → 20; total 30.</text>
<text x="258" y="694" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Canonical signature ignores sibling order, so 3 || 6 + 4 and 6 || 3 + 4 are one shape.</text>
<text x="258" y="714" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Values from the pool {1,2,3,4,5,6,8,9,10,12} Ω with “clean arithmetic”: half-ohm intermediates,</text>
<text x="258" y="734" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">answers to ≤ 2 decimals, no repeated answers.  Deterministic: same seed → identical bank.</text>
<text x="270" y="754" font-size="13" fill="#1E1E1E" text-anchor="start" font-weight="normal" font-family="Menlo, Courier, monospace">source: 20 V   circuit: 12 || 4 || (10 || 10 + 1)   ask: total current</text>
<text x="866" y="768" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">enumerate_lingo.py</text>
<rect x="920" y="616" width="280" height="174" rx="12" fill="#F3D9D3" stroke="#D8D2CA"/>
<text x="938" y="646" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">AI, fallback only</text>
<text x="938" y="674" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Used when the request asks for a</text>
<text x="938" y="694" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">family the enumerator has no rule for</text>
<text x="938" y="714" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(capacitors, meters, other asks).</text>
<text x="938" y="734" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Proposals go through step 4 like any</text>
<text x="938" y="754" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">other and are tagged source: llm.</text>
<text x="938" y="774" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Enumerated items: source: enumerate.</text>
<path d="M880,696 L920,696" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<text x="900.0" y="689" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">if no rule covers it</text>
<path d="M560.0,778 L560.0,818" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="818" width="640" height="142" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="258" y="848" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">4  Critique  (Agent 3)</text>
<text x="258" y="876" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">For every proposal: parse the lingo → solve → check ranges → count reduction steps → compare</text>
<text x="258" y="896" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">canonical shape with everything accepted so far.  Rejections carry a reason</text>
<text x="258" y="916" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(does not parse / outside ranges / wrong step count / repeated shape / repeated answer).</text>
<text x="258" y="936" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Accepted items are added via the framework's own add command; counts go back to the sidecar.</text>
<text x="866" y="950" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">critic.py --apply</text>
<path d="M240,940 L150,940 L150,636 L240,636" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<text x="142" y="788.0" font-size="12" fill="#555555" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">fewer than 30</text>
<text x="142" y="804.0" font-size="12" fill="#555555" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">accepted:</text>
<text x="142" y="820.0" font-size="12" fill="#555555" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">next pass</text>
<text x="142" y="836.0" font-size="12" fill="#555555" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">(max 5)</text>
<path d="M560.0,960 L560.0,1000" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="1000" width="640" height="202" rx="12" fill="#DCE6EE" stroke="#D8D2CA"/>
<text x="258" y="1030" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">5  Assemble  (replaces Agents 4 &amp; 5)</text>
<text x="258" y="1058" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">For each accepted lingo, the circuit-diagram engine:</text>
<text x="258" y="1078" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   • parses and solves, producing a numbered reduction (3 steps) and the total current;</text>
<text x="258" y="1098" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   • draws the figure with Schemdraw in the textbook (ladder) layout;</text>
<text x="258" y="1118" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   • computes distractors: all_series, no_invert, branch_current (+ fallbacks),</text>
<text x="258" y="1138" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">     and decoy_near_largest = 0.9 × the largest option;</text>
<text x="258" y="1158" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   • rotates the correct answer's position (k = n mod 5) so it is not always the same letter;</text>
<text x="258" y="1178" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">   • writes feedback naming the mistake behind each wrong option.</text>
<text x="866" y="1192" font-size="12" fill="#8A2A1B" text-anchor="end" font-weight="normal" font-family="Helvetica, Arial, sans-serif">assemble_bank.py + distractors.py</text>
<path d="M560.0,1202 L560.0,1242" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="1242" width="640" height="142" rx="12" fill="#E2EEDC" stroke="#D8D2CA"/>
<text x="258" y="1272" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">6  Bank file</text>
<text x="258" y="1300" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Problem-bank YAML in the shared template: 30 multiple-choice items, 5 options each,</text>
<text x="258" y="1320" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">figure paths, worked solutions, feedback, per-item source tag,</text>
<text x="258" y="1340" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">a difficulty block (steps 3 ×30; resistors 5 ×10, 6 ×20; parallel groups 1 ×15, 2 ×15)</text>
<text x="258" y="1360" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">and a provenance count (enumerate 30, llm 0).   PDF worksheet + key alongside.</text>
<rect x="920" y="1252" width="280" height="56" rx="6" fill="#E2EEDC" stroke="#C9C2B8" stroke-dasharray="4,3"/>
<text x="1060.0" y="1276" font-size="13" fill="#1E1E1E" text-anchor="middle" font-weight="normal" font-family="Menlo, Courier, monospace">PHY2-DC-SPRTC3-10292026.yaml</text>
<text x="1060.0" y="1295" font-size="11" fill="#555555" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif">+ Figures/q1…q30.png + .pdf</text>
<path d="M880,1280 L920,1280" stroke="#777" stroke-width="1.5" fill="none" marker-end="url(#a)" stroke-dasharray="5,4"/>
<path d="M560.0,1384 L560.0,1424" stroke="#777" stroke-width="2" fill="none" marker-end="url(#a)"/>
<rect x="240" y="1424" width="640" height="142" rx="12" fill="#E2EEDC" stroke="#D8D2CA"/>
<text x="258" y="1454" font-size="19" fill="#1E1E1E" text-anchor="start" font-weight="bold" font-family="Helvetica, Arial, sans-serif">7  Delivery</text>
<text x="258" y="1482" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Folder added to the ESTELA problem-bank repository (pull request).</text>
<text x="258" y="1502" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">ESTELA Enhanced Exam Builder loads it from GitHub: each exam version draws one item,</text>
<text x="258" y="1522" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">exports Canvas QTI, PDF or LaTeX.</text>
<text x="258" y="1542" font-size="14" fill="#555555" text-anchor="start" font-weight="normal" font-family="Helvetica, Arial, sans-serif">Planned validation: item-accuracy spread + extended Fisher's exact test on student data.</text>
</svg>