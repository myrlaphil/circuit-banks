bank_info:
    title: "Series-parallel resistor networks: total current (3 reduction steps)"
    bank_id: PHY2-DC-SPRTC3-10232026 # Subject-Unit-Abbreviation_of_title-date
    description: |-
      Isomorphic numerical problems. Each item is a different series-parallel topology of a single
      battery and resistors; the student reduces the network to an equivalent resistance and applies
      Ohm's law to find the total current. The topology (and hence the reduction sequence) changes
      between items, not only the numbers.
    date created: 10-23-2026
    status: ready # draft banks are skipped by the ESTELA exam builder
    learning objectives:
        - DC-SP-1
        - DC-OHM-1
    generation prompts:
        - prompt 1: |
            Scenarios are circuit-lingo strings generated by the circuit-bank-skill workflow
            (Agent 2 writes lingo, scripts/critic.py accepts only parseable, non-isomorphic ones).
        - prompt 2: |
            Numbers, figures and worked solutions: circuit-diagram-skill draw_circuit.py --solve (deterministic).
    associated data:
        - input scheme: "circuit-input.yaml"
        - scenario sidecar: "circuit-input.scenarios.yaml"
        - figures: "./figures/"
    generation details:
            model: LLM for lingo generation only; deterministic solver for every number
            version: 0.0.1
            last updated: 10-23-2026
    authors:
        - Myrla Phillippe

questions:
- multiple_choice:
    id: q1
    title: "Total current from the battery, 2 || (20 || 5 + 2)"
    points: 3
    figure: ./figures/q1.png
    circuit_lingo: |
        source: 15 V
        circuit: 2 || (20 || 5 + 2)
        ask: total current
    text: |
        The circuit shown is powered by a 15 V battery.
        Determine the total current supplied by the battery of the circuit shown.
    answers:
    - answer:
        text: "0.52 A"
        correct: false
    - answer:
        text: "15.88 A"
        correct: false
    - answer:
        text: "7.50 A"
        correct: false
    - answer:
        text: "10.00 A"
        correct: true
    feedback:
        general: |
            **Question.** Determine the total current supplied by the battery of the circuit shown.
            
            **Reduce the circuit**
            
            1. R2 and R3 are in parallel: 1/R23 = 1/20.00 Ω + 1/5.00 Ω, so R23 = **4.00 Ω**
            2. R23 and R4 are in series: R234 = 4.00 Ω + 2.00 Ω = **6.00 Ω**
            3. R1 and R234 are in parallel: 1/R1234 = 1/2.00 Ω + 1/6.00 Ω, so R1234 = **1.50 Ω**
            
            **Work back to the individual parts**
            
            1. The battery sees R1234 = 1.50 Ω, so the total current is I = V / R = 15.00 V / 1.50 Ω = **10.00 A**.
            2. R1 and R234 are in parallel (R1234), so each branch has the same voltage 15.00 V; each current is V / R (0 A through an open branch).
            3. R23 and R4 are in series (R234), so each carries the same current 2.50 A; each voltage is I × R (0 V across a wire).
            4. R2 and R3 are in parallel (R23), so each branch has the same voltage 10.00 V; each current is V / R (0 A through an open branch).
            
            | Part | Current | Voltage | Power |
            |---|---|---|---|
            | R1 (2.00 Ω) | 7.50 A | 15.00 V | 112.50 W |
            | R2 (20.00 Ω) | 0.50 A | 10.00 V | 5.00 W |
            | R3 (5.00 Ω) | 2.00 A | 10.00 V | 20.00 W |
            | R4 (2.00 Ω) | 2.50 A | 5.00 V | 12.50 W |
            | Battery | 10.00 A | 15.00 V | 150.00 W (delivered) |
            
            **Answer**
            
            - Total current from the battery = 10.00 A
            
            **Answer options (computed, each wrong option is one named mistake)**
            
            - 0.52 A: Student adds every resistor as if they were all in series.
            - 15.88 A: Student adds reciprocals for the parallel group but forgets to invert the sum.
            - 7.50 A: Student reports the current through R1 (one branch) instead of the total.
            - 10.00 A: Correct.
        on_correct: Good job!
        on_incorrect: Reduce the circuit step by step - combine the series and parallel groups first, then work back with Ohm's law.

