bank_info:
    title: "Series-parallel resistor networks: total current"
    bank_id: PHY2-DC-SPRTC-10222026 # Subject-Unit-Abbreviation_of_title-date
    description: |-
      Isomorphic numerical problems. Each item is a different series-parallel topology of a single
      battery and resistors; the student reduces the network to an equivalent resistance and applies
      Ohm's law to find the total current. The topology (and hence the reduction sequence) changes
      between items, not only the numbers.
    date created: 10-23-2026
    status: ready # draft banks are skipped by the ESTELA exam builder
    learning objectives:
        - DC-SP-1
        - DC-OHM-1
    generation prompts:
        - prompt 1: |
            Scenarios are circuit-lingo strings generated by the circuit-bank-skill workflow
            (Agent 2 writes lingo, scripts/critic.py accepts only parseable, non-isomorphic ones).
        - prompt 2: |
            Numbers, figures and worked solutions: circuit-diagram-skill draw_circuit.py --solve (deterministic).
    associated data:
        - input scheme: "circuit-input.yaml"
        - scenario sidecar: "circuit-input.scenarios.yaml"
        - figures: "./figures/"
    generation details:
            model: LLM for lingo generation only; deterministic solver for every number
            version: 0.0.1
            last updated: 10-23-2026
    authors:
        - Myrla Phillippe

questions:
- multiple_choice:
    id: q1
    title: "Total current from the battery, 3 || 6 + 4"
    points: 3
    figure: ./figures/q1.png
    circuit_lingo: |
        source: 12 V
        circuit: 3 || 6 + 4
        ask: total current
    text: |
        The circuit shown is powered by a 12 V battery.
        Determine the total current supplied by the battery of the circuit shown.
    answers:
    - answer:
        text: "0.92 A"
        correct: false
    - answer:
        text: "2.67 A"
        correct: false
    - answer:
        text: "1.33 A"
        correct: false
    - answer:
        text: "2.00 A"
        correct: true
    feedback:
        general: |
            **Question.** Determine the total current supplied by the battery of the circuit shown.
            
            **Reduce the circuit**
            
            1. R1 and R2 are in parallel: 1/R12 = 1/3.00 Ω + 1/6.00 Ω, so R12 = **2.00 Ω**
            2. R12 and R3 are in series: R123 = 2.00 Ω + 4.00 Ω = **6.00 Ω**
            
            **Work back to the individual parts**
            
            1. The battery sees R123 = 6.00 Ω, so the total current is I = V / R = 12.00 V / 6.00 Ω = **2.00 A**.
            2. R12 and R3 are in series (R123), so each carries the same current 2.00 A; each voltage is I × R (0 V across a wire).
            3. R1 and R2 are in parallel (R12), so each branch has the same voltage 4.00 V; each current is V / R (0 A through an open branch).
            
            | Part | Current | Voltage | Power |
            |---|---|---|---|
            | R1 (3.00 Ω) | 1.33 A | 4.00 V | 5.33 W |
            | R2 (6.00 Ω) | 0.67 A | 4.00 V | 2.67 W |
            | R3 (4.00 Ω) | 2.00 A | 8.00 V | 16.00 W |
            | Battery | 2.00 A | 12.00 V | 24.00 W (delivered) |
            
            **Answer**
            
            - Total current from the battery = 2.00 A
            
            **Answer options (computed, each wrong option is one named mistake)**
            
            - 0.92 A: Student adds every resistor as if they were all in series.
            - 2.67 A: Student adds reciprocals for the parallel group but forgets to invert the sum.
            - 1.33 A: Student reports the current through R1 (one branch) instead of the total.
            - 2.00 A: Correct.
        on_correct: Good job!
        on_incorrect: Reduce the circuit step by step - combine the series and parallel groups first, then work back with Ohm's law.

